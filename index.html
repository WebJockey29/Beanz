<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Beanz Dial-In</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <header>
      <h1>Beanz</h1>
      <p class="sub">Barista Express dial-in · target 18 g → 36 g in 25–30 s</p>
    </header>

    <section class="card">
      <h2>Bag</h2>
      <div class="row">
        <select id="bag-select" aria-label="Current bag"></select>
        <button id="delete-bag" class="ghost" type="button">Delete</button>
      </div>
      <form id="bag-form" class="row">
        <input id="bag-name" placeholder="New bag, e.g. Ethiopia Guji" required />
        <select id="bag-roast" aria-label="Roast">
          <option value="light">Light</option>
          <option value="medium" selected>Medium</option>
          <option value="dark">Dark</option>
        </select>
        <button type="submit">Add</button>
      </form>
      <p id="start-hint" class="hint"></p>
    </section>

    <section class="card">
      <h2>Log a shot</h2>
      <form id="shot-form" class="grid">
        <label>Grind setting<input id="setting" type="number" min="1" max="16" step="1" required /></label>
        <label>Dose (g)<input id="dose" type="number" step="0.1" value="18" required /></label>
        <label>Time (s)<input id="time" type="number" step="0.1" required /></label>
        <label>Yield (g)<input id="yield" type="number" step="0.1" required /></label>
        <label class="wide">Taste (optional)
          <select id="taste">
            <option value="">Not tasted</option>
            <option value="sour">Sour / thin</option>
            <option value="balanced">Balanced</option>
            <option value="bitter">Bitter / harsh</option>
          </select>
        </label>
        <button class="wide" type="submit">Log shot &amp; recommend</button>
      </form>
    </section>

    <section id="rec" class="card rec" hidden></section>

    <section class="card">
      <h2>Shots in this bag</h2>
      <table>
        <thead><tr><th>#</th><th>Grind</th><th>Dose</th><th>Time</th><th>Yield</th><th>@36 g</th><th>Taste</th><th></th></tr></thead>
        <tbody id="shots"></tbody>
      </table>
      <p id="empty" class="hint">No shots yet.</p>
    </section>
  </main>
  <script type="module" src="src/app.js"></script>
</body>
</html>
